      <rect x="105" y="97" width="19" height="81"/>
      <rect x="131" y="80" width="20" height="98"/>
      <rect x="158" y="132" width="19" height="46"/>
      <rect x="184" y="162" width="18" height="16"/>
    </g>
    <path id="bell-curve" d="M20 176C55 174 75 154 92 116C107 83 116 69 130 69C145 69 154 92 167 122C184 160 206 172 237 176" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
    </g>
    <g id="text-layer" inkscape:groupmode="layer" inkscape:label="Text">
    <g id="flat-script" fill="none" stroke="#ffffff" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 234C20 223 28 202 33 192M23 194C33 191 43 190 54 192M24 213L47 210"/>
      <path d="M67 192C64 203 57 217 54 227Q52 233 60 229"/>
      <path d="M90 211C80 202 67 223 73 229C79 235 88 219 91 211L85 226C82 234 91 229 96 225"/>
      <path d="M113 196L104 220C98 236 111 230 119 223M101 208L124 205"/>
    </g>
    <g id="ppl-wordmark" fill-rule="evenodd">
      <path d="M136 190H151C162 190 168 195 168 205C168 215 161 220 151 220H144V234H136ZM144 198V212H151C157 212 160 210 160 205C160 200 157 198 151 198Z"/>
      <path d="M175 190H190C201 190 207 195 207 205C207 215 200 220 190 220H183V234H175ZM183 198V212H190C196 212 199 210 199 205C199 200 196 198 190 198Z"/>
      <path d="M214 190H222V226H242V234H214Z"/>
    </g>
    </g>
  </g>
    <g id="outline-layer" inkscape:groupmode="layer" inkscape:label="Solid outlines" fill="#ffffff">
      <use id="nodes-outline" href="#graph-nodes" filter="url(#inset-outline)"/>
      <use id="arrows-outline" href="#graph-arrows" filter="url(#inset-outline)"/>
      <use id="plot-outline" href="#plot-layer" filter="url(#inset-outline)"/>
      <use id="text-outline" href="#text-layer" filter="url(#inset-outline)"/>
    </g>
  </g>
</svg>

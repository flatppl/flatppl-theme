name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile
      - run: bun test

      - name: Match tag to package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          test "$RELEASE_TAG" = "v${package_version}"

      - name: Build release bundle
        env:
          FLATPPL_THEME_RELEASE: ${{ github.ref_name }}
        run: bun run build

      - run: bun run scripts/verify-bundle.ts dist

      - name: Pack release bundle
        run: tar -czf "flatppl-theme-${GITHUB_REF_NAME}.tar.gz" -C dist .

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "flatppl-theme-${GITHUB_REF_NAME}.tar.gz" --generate-notes --verify-tag
